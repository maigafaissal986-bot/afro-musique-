<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Afro Musique AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #253b1f, transparent 40%),
        linear-gradient(135deg, #050505, #101010 55%, #191919);
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #d4af37, #fff1a8);
      color: #111;
      font-size: 32px;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(212,175,55,.35);
    }

    h1 {
      margin-top: 15px;
      font-size: 32px;
    }

    .subtitle {
      color: #cfcfcf;
      margin-top: 8px;
    }

    .status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      background: #151515;
      border: 1px solid #333;
      color: #ddd;
    }

    .card {
      background: rgba(25,25,25,.95);
      border: 1px solid #333;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .card h2 {
      margin-bottom: 20px;
      color: #f0d36a;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #0d0d0d;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212,175,55,.12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .generate {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #d4af37, #f5dc79);
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:active {
      transform: scale(.98);
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 15px;
      background: #101810;
      border: 1px solid #365c36;
    }

    .result h3 {
      color: #f0d36a;
      margin-bottom: 12px;
    }

    .error {
      background: #351313;
      border-color: #713333;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      h1 {
        font-size: 27px;
      }

      .card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">🎵</div>

      <h1>Afro Musique AI</h1>

      <p class="subtitle">
        Crée ta musique afro avec l'intelligence artificielle
      </p>
    </div>

    <div class="status" id="statut">
      🟡 Vérification du serveur...
    </div>

    <div class="card">

      <h2>🎶 Créer une nouvelle musique</h2>

      <label for="titre">Titre de la musique</label>
      <input
        id="titre"
        type="text"
        placeholder="Exemple : Bamako mon amour"
      >

      <label for="artiste">Nom de l'artiste</label>
      <input
        id="artiste"
        type="text"
        placeholder="Exemple : Faïssal"
      >

      <label for="style">Style musical</label>

      <select id="style">
        <option value="Afrobeat">Afrobeat</option>
        <option value="Afropop">Afropop</option>
        <option value="Amapiano">Amapiano</option>
        <option value="Coupé-décalé">Coupé-décalé</option>
        <option value="Afro Mandingue">Afro Mandingue</option>
        <option value="Reggae">Reggae</option>
        <option value="Rap">Rap</option>
        <option value="Gospel">Gospel</option>
      </select>

      <label for="description">Description / idée de la chanson</label>

      <textarea
        id="description"
        placeholder="Décris la chanson que tu souhaites créer..."
      ></textarea>

      <button class="generate" onclick="genererMusique()">
        🎵 GÉNÉRER LA MUSIQUE
      </button>

      <div class="result" id="resultat">

        <h3>🎉 Demande reçue</h3>

        <p id="message"></p>

        <br>

        <p>
          <strong>Titre :</strong>
          <span id="resultTitre"></span>
        </p>

        <p>
          <strong>Artiste :</strong>
          <span id="resultArtiste"></span>
        </p>

        <p>
          <strong>Style :</strong>
          <span id="resultStyle"></span>
        </p>

      </div>

    </div>

    <div class="footer">
      Afro Musique AI • Création musicale intelligente
    </div>

  </div>


  <script>

    // Vérification du serveur
    async function verifierServeur() {

      const statut = document.getElementById("statut");

      try {

        const reponse = await fetch("/santé");

        if (!reponse.ok) {
          throw new Error("Serveur indisponible");
        }

        const data = await reponse.json();

        statut.innerHTML = "🟢 Serveur Afro Musique opérationnel";

      } catch (erreur) {

        statut.innerHTML = "🔴 Serveur non disponible";

      }
    }


    // Génération musicale
    async function genererMusique() {

      const titre =
        document.getElementById("titre").value.trim();

      const artiste =
        document.getElementById("artiste").value.trim();

      const style =
        document.getElementById("style").value;

      const description =
        document.getElementById("description").value.trim();

      const resultat =
        document.getElementById("resultat");

      const message =
        document.getElementById("message");

      if (!titre || !description) {

        resultat.style.display = "block";
        resultat.classList.add("error");

        message.innerHTML =
          "⚠️ Veuillez remplir le titre et la description.";

        return;
      }

      resultat.style.display = "block";
      resultat.classList.remove("error");

      message.innerHTML =
        "⏳ Préparation de votre demande musicale...";

      try {

        const reponse = await fetch("/génératrice", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            titre: titre,
            artiste: artiste,
            style: style,
            description: description
          })

        });

        const data = await reponse.json();

        if (!reponse.ok) {
          throw new Error(
            data.erreur || "Erreur du serveur"
          );
        }

        message.innerHTML =
          data.message || "Demande reçue avec succès.";

        document.getElementById("resultTitre").textContent =
          data.musique?.titre || titre;

        document.getElementById("resultArtiste").textContent =
          data.musique?.artiste || artiste || "Artiste";

        document.getElementById("resultStyle").textContent =
          data.musique?.style || style;

      } catch (erreur) {

        resultat.classList.add("error");

        message.innerHTML =
          "❌ Erreur : " + erreur.message;

      }

    }


    // Lancer la vérification
    verifierServeur();

  </script>

</body>
</html>
