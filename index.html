<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afro Musique</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #100c06;
      color: white;
      font-family: Arial, sans-serif;
    }
    h1 { text-align: center; color: #f4cf69; }
    .subtitle {
      text-align: center;
      color: #f4cf69;
      margin-bottom: 30px;
    }
    .card {
      max-width: 650px;
      margin: auto;
      padding: 25px;
      border: 1px solid #51452c;
      border-radius: 25px;
      background: #211d17;
    }
    label {
      display: block;
      font-weight: bold;
      margin: 20px 0 10px;
    }
    input, select, textarea {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 15px;
      background: white;
      color: #111;
      font-size: 17px;
    }
    textarea { min-height: 150px; resize: vertical; }
    button {
      width: 100%;
      padding: 20px;
      margin-top: 25px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(90deg, #d9a52e, #ffe080);
      color: #171006;
      font-size: 19px;
      font-weight: bold;
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    #result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #776333;
      border-radius: 15px;
      overflow-wrap: anywhere;
    }
    footer {
      text-align: center;
      color: #aaa;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>🎵 Afro Musique</h1>
  <p class="subtitle">Création de musique africaine avec l'intelligence artificielle</p>

  <main class="card">
    <form id="musicForm">
      <label for="titre">Titre de la chanson</label>
      <input id="titre" required value="La paix">

      <label for="artiste">Nom de l'artiste</label>
      <input id="artiste" value="Iba One">

      <label for="style">Style musical</label>
      <select id="style">
        <option>Afrobeat</option>
        <option>Afropop</option>
        <option>Rap malien</option>
        <option>Mandingo</option>
        <option>Gospel</option>
        <option>Reggae</option>
      </select>

      <label for="description">Description / paroles</label>
      <textarea id="description" required
        placeholder="Décris la chanson que tu souhaites créer..."></textarea>

      <button id="submitBtn" type="submit">🎶 Envoyer la demande</button>
    </form>

    <div id="status">🔄 Vérification de la connexion...</div>
    <section id="result">
      <h2>🎵 Résultat de ta demande</h2>
      <pre id="resultText" style="white-space:pre-wrap"></pre>
    </section>
  </main>

  <footer>© 2026 Afro Musique</footer>

  <script>
    const API_URL = "https://afro-musique-api.onrender.com";

    async function checkAPI() {
      const status = document.getElementById("status");
      try {
        const response = await fetch(API_URL + "/");
        const data = await response.json();

        if (!response.ok) throw new Error("HTTP " + response.status);

        status.textContent = "🟢 API connectée : " + data.message;
      } catch (error) {
        status.textContent =
          "🔴 API inaccessible. Vérifie le serveur Render.";
        console.error(error);
      }
    }

    document.getElementById("musicForm").addEventListener("submit",
      async function(event) {
        event.preventDefault();

        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const resultText = document.getElementById("resultText");
        const button = document.getElementById("submitBtn");

        const payload = {
          titre: document.getElementById("titre").value.trim(),
          artiste: document.getElementById("artiste").value.trim(),
          style: document.getElementById("style").value,
          description: document.getElementById("description").value.trim()
        };

        if (!payload.titre || !payload.description) {
          status.textContent = "⚠️ Remplis le titre et la description.";
          return;
        }

        button.disabled = true;
        status.textContent = "⏳ Envoi de ta demande...";
        result.style.display = "none";

        try {
          const response = await fetch(API_URL + "/génératrice", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const text = await response.text();
          let data;

          try {
            data = JSON.parse(text);
          } catch {
            throw new Error(
              "Le serveur a renvoyé une page HTML au lieu du JSON. " +
              "Vérifie la route API et le déploiement Render."
            );
          }

          if (!response.ok) {
            throw new Error(data.erreur || data.error ||
              "Erreur HTTP " + response.status);
          }

          status.textContent = "✅ Demande reçue par le serveur.";
          resultText.textContent = JSON.stringify(data, null, 2);
          result.style.display = "block";
        } catch (error) {
          status.textContent = "🔴 Échec : " + error.message;
          console.error(error);
        } finally {
          button.disabled = false;
        }
      });

    checkAPI();
  </script>
</body>
</html>
