<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Afro Musique - Création musicale IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      background: #100c06;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    header {
      text-align: center;
      margin: 20px 0 35px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      font-weight: bold;
    }

    .subtitle {
      color: #e9bd55;
      font-size: 20px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .card {
      background: linear-gradient(145deg, #29241d, #1b1711);
      border: 1px solid #494035;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 8px 30px #0005;
    }

    label {
      display: block;
      font-size: 19px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 17px;
      background: white;
      color: #171717;
      font-size: 18px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 20px 12px;
      border: none;
      border-radius: 17px;
      background: linear-gradient(100deg, #dca52e, #ffdf80);
      color: #17120a;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .status,
    .result {
      margin-top: 22px;
      padding: 17px;
      border-radius: 15px;
      background: #203b27;
      color: #8af0a6;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .result {
      display: none;
      background: #242018;
      color: white;
      border: 1px solid #66532b;
    }

    .result h2 {
      color: #f2cd6c;
      font-size: 21px;
    }

    .footer {
      text-align: center;
      color: #aaa;
      margin: 28px 0 10px;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      .card {
        padding: 20px;
      }

      .subtitle {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>🎵 Afro Musique</h1>

      <div class="subtitle">
        Création de musique africaine<br>
        avec l'intelligence artificielle
      </div>
    </header>

    <section class="card">

      <form id="musicForm">

        <label for="titre">Titre de la chanson</label>
        <input
          id="titre"
          name="titre"
          type="text"
          placeholder="Exemple : La paix"
          required
        >

        <label for="artiste">Nom de l'artiste</label>
        <input
          id="artiste"
          name="artiste"
          type="text"
          placeholder="Nom de l'artiste"
        >

        <label for="style">Style musical</label>
        <select id="style" name="style">
          <option value="Afrobeat">Afrobeat</option>
          <option value="Afropop">Afropop</option>
          <option value="Mandingue">Mandingue</option>
          <option value="Rap africain">Rap africain</option>
          <option value="Afro-fusion">Afro-fusion</option>
          <option value="Gospel africain">Gospel africain</option>
          <option value="Reggae">Reggae</option>
          <option value="Traditionnel malien">Traditionnel malien</option>
        </select>

        <label for="description">Description / paroles</label>
        <textarea
          id="description"
          name="description"
          placeholder="Décris la chanson que tu souhaites créer..."
          required
        ></textarea>

        <button id="generateButton" type="submit">
          🎶 Générer la musique
        </button>

      </form>

      <div id="status" class="status" role="status">
        🔄 Vérification de la connexion...
      </div>

      <section id="result" class="result">
        <h2>🎵 Résultat de ta demande</h2>
        <p id="message"></p>
        <p id="details"></p>
      </section>

    </section>

    <div class="footer">
      © 2026 Afro Musique
    </div>

  </main>

  <script>
    const API_URL = "https://afro-musique-api.onrender.com";

    const statusBox = document.getElementById("status");
    const form = document.getElementById("musicForm");
    const button = document.getElementById("generateButton");
    const resultBox = document.getElementById("result");
    const messageBox = document.getElementById("message");
    const detailsBox = document.getElementById("details");

    async function verifierConnexion() {
      statusBox.textContent = "🔄 Connexion au serveur en cours...";

      try {
        const response = await fetch(API_URL + "/", {
          method: "GET"
        });

        if (!response.ok) {
          throw new Error("Le serveur a répondu avec une erreur.");
        }

        const data = await response.json();

        statusBox.textContent =
          "🟢 Serveur connecté : " +
          (data.message || "Afro Musique est disponible.");

      } catch (error) {
        console.error("Erreur de connexion :", error);

        statusBox.textContent =
          "🔴 Connexion impossible. Réessaie dans quelques secondes.";
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const titre = document.getElementById("titre").value.trim();
      const artiste = document.getElementById("artiste").value.trim();
      const style = document.getElementById("style").value;
      const description =
        document.getElementById("description").value.trim();

      if (!titre || !description) {
        alert("Veuillez remplir le titre et la description.");
        return;
      }

      button.disabled = true;
      button.textContent = "⏳ Envoi de la demande...";
      resultBox.style.display = "block";
      messageBox.textContent = "Connexion au serveur...";
      detailsBox.textContent = "";

      try {
        const response = await fetch(
          API_URL + "/g%C3%A9n%C3%A9ratrice",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              titre: titre,
              artiste: artiste,
              style: style,
              description: description
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.erreur || data.error || "Le serveur a refusé la demande."
          );
        }

        messageBox.textContent =
          "✅ " + (data.message || "Ta demande a été reçue.");

        detailsBox.textContent =
          "Titre : " + titre +
          " | Artiste : " + (artiste || "Non précisé") +
          " | Style : " + style +
          ". La demande a été envoyée au serveur. " +
          "Aucun fichier audio n'est encore généré par cette version.";

        statusBox.textContent = "🟢 Demande envoyée au serveur.";

      } catch (error) {
        console.error("Erreur lors de l'envoi :", error);

        messageBox.textContent = "❌ " + error.message;

        detailsBox.textContent =
          "Vérifie la connexion au serveur et réessaie.";

        statusBox.textContent =
          "🔴 Échec de l'envoi de la demande.";
      } finally {
        button.disabled = false;
        button.textContent = "🎶 Générer la musique";
      }
    });

    verifierConnexion();
  </script>
</body>
</html>
